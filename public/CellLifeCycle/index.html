<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Journey Through The Cell</title>

<style>

html,body{
    margin:0;
    overflow:hidden;
    width:100%;
    height:100%;
    background:#24113d;
    font-family:Arial,Helvetica,sans-serif;
}

canvas{
    display:block;
}

#hud{

    position:absolute;

    top:15px;
    left:15px;

    width:320px;

    background:rgba(0,0,0,.65);

    color:white;

    padding:15px;

    border-radius:12px;

    z-index:10;

}

#scanner{

    position:absolute;

    bottom:15px;
    left:15px;

    width:320px;

    background:rgba(0,0,0,.65);

    color:white;

    padding:15px;

    border-radius:12px;

    z-index:10;

}

</style>

<script type="importmap">
{
    "imports":{
        "three":"https://unpkg.com/three@0.161.0/build/three.module.js",
        "three/addons/":"https://unpkg.com/three@0.161.0/examples/jsm/"
    }
}
</script>

</head>

<body>

<div id="hud">

<h2>🧬 Journey Through The Cell</h2>

<p>
Explore the interior of an animal cell.
</p>

<p>
Mouse = Rotate<br>
Wheel = Zoom<br>
Right Click = Pan
</p>

</div>

<div id="scanner">

Click an organelle to learn about it.

</div>

<script type="module" src="./app.js"></script>

</body>
</html>
