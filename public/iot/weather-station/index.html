<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Environmental IoT Station - 3D</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Courier New', monospace; background-color: #0a1a1a; }
    
    #hud {
      position: absolute;
      bottom: 30px;
      left: 30px;
      background: rgba(5, 15, 20, 0.88);
      border: 1px solid #0ff;
      box-shadow: 0 0 35px rgba(0, 255, 255, 0.1);
      padding: 18px 24px;
      border-radius: 8px;
      color: #8ab;
      min-width: 220px;
      pointer-events: none;
      backdrop-filter: blur(4px);
      z-index: 10;
      border-left: 4px solid #00ffaa;
    }
    #hud .title {
      color: #00ffaa;
      font-size: 0.75rem;
      letter-spacing: 3px;
      text-shadow: 0 0 10px #00ffaa88;
      margin-bottom: 10px;
      border-bottom: 1px dashed #1a3a3a;
      padding-bottom: 6px;
    }
    #hud .row {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      padding: 3px 0;
    }
    #hud .value { color: #fff; font-weight: bold; }
    .highlight-green { color: #0f0; text-shadow: 0 0 5px #0f0; }
    .highlight-cyan { color: #0ff; text-shadow: 0 0 5px #0ff; }
    .highlight-orange { color: #fa0; text-shadow: 0 0 5px #fa0; }
    .highlight-pink { color: #f8a; text-shadow: 0 0 5px #f8a; }

    #controls {
      position: absolute;
      bottom: 30px;
      right: 30px;
      background: rgba(5, 15, 20, 0.88);
      border: 1px solid #355;
      padding: 16px 20px;
      border-radius: 8px;
      color: #8ab;
      backdrop-filter: blur(4px);
      z-index: 10;
      pointer-events: auto;
      min-width: 170px;
      border-right: 4px solid #0ff;
    }
    #controls label {
      display: block;
      font-size: 0.65rem;
      letter-spacing: 1px;
      color: #5a8a8a;
      margin-top: 8px;
    }
    #controls label:first-child { margin-top: 0; }
    #controls input[type="range"] {
      width: 100%;
      margin: 4px 0 0 0;
      background: #1a2a2a;
      height: 4px;
      border-radius: 2px;
      -webkit-appearance: none;
      appearance: none;
      outline: none;
    }
    #controls input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #00ffaa;
      cursor: pointer;
      box-shadow: 0 0 15px #00ffaa;
    }
    #controls .hint {
      font-size: 0.55rem;
      color: #4a6a6a;
      margin-top: 10px;
      border-top: 1px solid #1a2a2a;
      padding-top: 6px;
      line-height: 1.4;
    }
    #controls .hint span { color: #00ffaa; }

    #click-prompt {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      color: #5a8a8a;
      font-size: 0.75rem;
      background: rgba(0,0,0,0.5);
      padding: 5px 22px;
      border-radius: 30px;
      border: 1px solid #1a3a3a;
      z-index: 10;
      pointer-events: none;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <div id="hud">
    <div class="title">🌍 ENVIRONMENTAL IoT STATUS</div>
    <div class="row"><span>Temperature</span><span class="value highlight-orange" id="temp-display">21.0 °C</span></div>
    <div class="row"><span>Humidity</span><span class="value highlight-cyan" id="humidity-display">65 %</span></div>
    <div class="row"><span>Pressure</span><span class="value" id="pressure-display" style="color:#fff;">1013 hPa</span></div>
    <div class="row"><span>Wind Speed</span><span class="value highlight-cyan" id="wind-display">2.5 m/s</span></div>
    <div class="row"><span>Air Quality (AQI)</span><span class="value" id="aqi-display" style="color:#0f0;">42 (Good)</span></div>
    <div class="row"><span>Rain Accum.</span><span class="value" id="rain-display" style="color:#88ddff;">0.0 mm</span></div>
  </div>

  <div id="controls">
    <label for="rain-slider">☔ RAIN INTENSITY</label>
    <input type="range" id="rain-slider" min="0" max="100" value="10">
    <label for="wind-slider">🌬️ WIND SPEED</label>
    <input type="range" id="wind-slider" min="0" max="10" step="0.1" value="2.5">
    <label for="temp-slider">🌡️ TEMPERATURE</label>
    <input type="range" id="temp-slider" min="-10" max="45" step="0.5" value="21">
    <div class="hint">🖱️ Click <span>Mast</span> (toggle data) · Click <span>Rain Gauge</span> (storm)</div>
  </div>

  <div id="click-prompt">🌱 SMART ENVIRONMENTAL SENSOR NETWORK</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // --- 1. SCENE SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); // Sky blue
    scene.fog = new THREE.Fog(0x87CEEB, 40, 80);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 120);
    camera.position.set(35, 20, 35);
    camera.lookAt(0, 2, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.prepend(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.target.set(0, 3, 0);
    controls.maxPolarAngle = Math.PI / 2.1;
    controls.minDistance = 5;
    controls.maxDistance = 70;

    // --- 2. LIGHTS ---
    const ambient = new THREE.AmbientLight(0x88bbcc, 0.6);
    scene.add(ambient);

    const sunLight = new THREE.DirectionalLight(0xffeedd, 2.5);
    sunLight.position.set(20, 30, 15);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    const d = 45;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    sunLight.shadow.camera.near = 1;
    sunLight.shadow.camera.far = 60;
    scene.add(sunLight);

    const fill = new THREE.DirectionalLight(0x8888ff, 0.4);
    fill.position.set(-20, 10, -20);
    scene.add(fill);

    const hemi = new THREE.HemisphereLight(0x87CEEB, 0x3a5a3a, 0.8);
    scene.add(hemi);

    // --- 3. TERRAIN (Rolling Hills) ---
    const terrainWidth = 70;
    const terrainDepth = 70;
    const segments = 64;
    const geo = new THREE.PlaneGeometry(terrainWidth, terrainDepth, segments, segments);
    geo.rotateX(-Math.PI / 2);
    
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const z = pos.getZ(i);
      // Create rolling hills
      let y = Math.sin(x * 0.12) * 1.8 + Math.cos(z * 0.15) * 1.5 + Math.sin(x * 0.05 + z * 0.08) * 1.2;
      // Flatten the center area for the main station
      const dist = Math.hypot(x, z);
      if (dist < 6) y *= 0.1; 
      pos.setY(i, y);
    }
    geo.computeVertexNormals();

    // Color the terrain based on height (grass gradient)
    const colors = [];
    for (let i = 0; i < pos.count; i++) {
      const y = pos.getY(i);
      const mix = (y + 2) / 4; // 0 to 1 roughly
      const r = 0.2 + mix * 0.15;
      const g = 0.4 + mix * 0.35;
      const b = 0.1 + mix * 0.1;
      colors.push(r, g, b);
    }
    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

    const terrainMat = new THREE.MeshStandardMaterial({ 
      vertexColors: true, 
      roughness: 0.9, 
      metalness: 0.0,
      flatShading: false
    });
    const terrain = new THREE.Mesh(geo, terrainMat);
    terrain.receiveShadow = true;
    terrain.position.y = -0.2;
    scene.add(terrain);

    // --- 4. LAKE ---
    const lakeGeo = new THREE.CircleGeometry(5, 24);
    const lakeMat = new THREE.MeshStandardMaterial({ 
      color: 0x1a6a8a, 
      roughness: 0.2, 
      metalness: 0.7, 
      transparent: true, 
      opacity: 0.8 
    });
    const lake = new THREE.Mesh(lakeGeo, lakeMat);
    lake.rotation.x = -Math.PI / 2;
    lake.position.set(10, -0.1, 12);
    scene.add(lake);

    // --- 5. UTILITY FUNCTIONS (Assets) ---

    // Tree (greener version)
    function createTree(posX, posZ, scale = 1) {
      const group = new THREE.Group();
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5a4a3a, roughness: 0.9 });
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1*scale, 0.15*scale, 0.7*scale), trunkMat);
      trunk.position.y = 0.35*scale;
      trunk.castShadow = true;
      group.add(trunk);

      const leafMat = new THREE.MeshStandardMaterial({ color: 0x3a8a3a, roughness: 0.8 });
      const crown = new THREE.Mesh(new THREE.SphereGeometry(0.5*scale + Math.random()*0.2, 5), leafMat);
      crown.position.y = 0.9*scale + Math.random()*0.2;
      crown.castShadow = true;
      group.add(crown);
      
      group.position.set(posX, 0, posZ);
      return group;
    }

    // 5a. Weather Mast (Main Tower)
    function createWeatherMast() {
      const group = new THREE.Group();
      
      // Tower
      const towerMat = new THREE.MeshStandardMaterial({ color: 0x8a9a9a, metalness: 0.6, roughness: 0.3 });
      const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.25, 5.0), towerMat);
      tower.position.y = 2.5;
      tower.castShadow = true;
      group.add(tower);

      // Cross arms
      const arm = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.06, 0.06), towerMat);
      arm.position.set(0, 4.2, 0);
      group.add(arm);
      const arm2 = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 1.2), towerMat);
      arm2.position.set(0, 4.2, 0);
      group.add(arm2);

      // Sensor Box (weatherproof housing)
      const boxMat = new THREE.MeshStandardMaterial({ color: 0xccddee, roughness: 0.5 });
      const box = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.4, 0.4), boxMat);
      box.position.set(0, 3.8, 0.5);
      group.add(box);
      // Thermometer (visual stripe)
      const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.1, 0.05), 
        new THREE.MeshStandardMaterial({ color: 0xff4444, emissive: 0xff2222, emissiveIntensity: 0.2 }));
      stripe.position.set(0, 3.8, 0.72);
      group.add(stripe);

      // Anemometer (Spinning cups)
      const anemGroup = new THREE.Group();
      anemGroup.position.set(0, 4.6, 0);
      const cupMat = new THREE.MeshStandardMaterial({ color: 0xeeeeff, roughness: 0.2 });
      for (let i = 0; i < 3; i++) {
        const angle = (i / 3) * Math.PI * 2;
        const armCup = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.04, 0.04), towerMat);
        armCup.position.set(Math.cos(angle) * 0.5, 0, Math.sin(angle) * 0.5);
        anemGroup.add(armCup);
        const cup = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.15, 6), cupMat);
        cup.position.set(Math.cos(angle) * 0.7, 0, Math.sin(angle) * 0.7);
        cup.rotation.z = Math.PI / 2;
        cup.rotation.y = angle;
        anemGroup.add(cup);
      }
      group.add(anemGroup);

      // Wind Vane
      const vaneGroup = new THREE.Group();
      vaneGroup.position.set(0, 4.3, 0);
      const vaneArm = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.02, 0.02), towerMat);
      vaneArm.position.x = 0.25;
      vaneGroup.add(vaneArm);
      const vaneTail = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.25, 0.02), 
        new THREE.MeshStandardMaterial({ color: 0xff8844 }));
      vaneTail.position.set(0.5, 0, 0);
      vaneGroup.add(vaneTail);
      group.add(vaneGroup);

      group.userData = { anemGroup, vaneGroup, isMast: true };
      return group;
    }

    // 5b. Rain Gauge
    function createRainGauge() {
      const group = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color: 0xccddee, roughness: 0.3 });
      
      // Base cylinder
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 0.6), mat);
      base.position.y = 0.3;
      base.castShadow = true;
      group.add(base);

      // Funnel (cone)
      const funnel = new THREE.Mesh(new THREE.ConeGeometry(0.7, 0.3, 12), 
        new THREE.MeshStandardMaterial({ color: 0xbbccdd, roughness: 0.4 }));
      funnel.position.y = 0.75;
      group.add(funnel);

      // Inner water (rises with rain)
      const waterMat = new THREE.MeshStandardMaterial({ color: 0x2288cc, transparent: true, opacity: 0.6 });
      const water = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.1), waterMat);
      water.position.y = 0.4;
      group.add(water);

      group.position.set(14, 0.2, -10);
      group.userData = { water, isGauge: true, rainLevel: 0 };
      return group;
    }

    // 5c. Air Quality Node
    function createAQISensor(posX, posZ) {
      const group = new THREE.Group();
      const boxMat = new THREE.MeshStandardMaterial({ color: 0x2a3a3a, roughness: 0.7 });
      const base = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.15, 0.6), boxMat);
      base.position.y = 0.1;
      group.add(base);

      const body = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), 
        new THREE.MeshStandardMaterial({ color: 0x4a5a5a }));
      body.position.y = 0.35;
      group.add(body);

      // Glowing LED
      const ledMat = new THREE.MeshStandardMaterial({ color: 0x00ff00, emissive: 0x00ff00, emissiveIntensity: 0.8 });
      const led = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6), ledMat);
      led.position.set(0, 0.55, 0.25);
      group.add(led);

      // Solar panel on top
      const panel = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.02, 0.2), 
        new THREE.MeshStandardMaterial({ color: 0x112244, emissive: 0x224488, emissiveIntensity: 0.1 }));
      panel.position.set(0, 0.55, -0.1);
      panel.rotation.x = -0.3;
      group.add(panel);

      group.position.set(posX, 0.2, posZ);
      group.userData = { led, ledMat, isAQI: true };
      return group;
    }

    // 5d. Radar Dish (Rotating)
    function createRadar(posX, posZ) {
      const group = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color: 0x8a9aaa, metalness: 0.7, roughness: 0.2 });
      
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 0.3), mat);
      base.position.y = 0.15;
      group.add(base);

      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 1.0), mat);
      pole.position.y = 0.7;
      group.add(pole);

      const dishGroup = new THREE.Group();
      dishGroup.position.y = 1.2;
      
      const dish = new THREE.Mesh(new THREE.CircleGeometry(0.6, 12), 
        new THREE.MeshStandardMaterial({ color: 0xccddee, side: THREE.DoubleSide, metalness: 0.8, roughness: 0.2 }));
      dish.rotation.x = -Math.PI / 2.5;
      dishGroup.add(dish);

      const center = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6), 
        new THREE.MeshStandardMaterial({ color: 0xff4444, emissive: 0xff0000, emissiveIntensity: 0.4 }));
      center.position.set(0, 0, -0.6);
      dishGroup.add(center);

      group.add(dishGroup);

      group.position.set(-18, 0.2, -8);
      group.userData = { dishGroup };
      return group;
    }

    // 5e. Small IoT Ground Nodes (scattered)
    function createGroundNode(posX, posZ) {
      const group = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.1, 0.2), 
        new THREE.MeshStandardMaterial({ color: 0x5a6a6a }));
      body.position.y = 0.05;
      group.add(body);
      const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.2), 
        new THREE.MeshStandardMaterial({ color: 0x88aabb }));
      antenna.position.set(0, 0.15, 0);
      group.add(antenna);
      // Blinking light
      const light = new THREE.Mesh(new THREE.SphereGeometry(0.03, 4), 
        new THREE.MeshStandardMaterial({ color: 0x00ffaa, emissive: 0x00ffaa, emissiveIntensity: 0.5 }));
      light.position.set(0, 0.1, 0.1);
      group.add(light);
      
      group.position.set(posX, 0.1, posZ);
      return group;
    }

    // --- 6. BUILD THE ENVIRONMENT ---

    // 6a. Main Station Assets
    const mast = createWeatherMast();
    mast.position.set(0, 0.2, 0);
    scene.add(mast);

    const rainGauge = createRainGauge();
    scene.add(rainGauge);

    const radar = createRadar(-18, -8);
    scene.add(radar);

    // 6b. AQI Sensors (4 of them)
    const aqiSensors = [];
    const aqiPositions = [[-10, 10], [12, -14], [-15, -15], [18, 12]];
    aqiPositions.forEach(pos => {
      const sensor = createAQISensor(pos[0], pos[1]);
      scene.add(sensor);
      aqiSensors.push(sensor);
    });

    // 6c. Ground Nodes (8 scattered)
    const nodePositions = [
      [-5, -8], [8, 5], [-12, 5], [15, -5], 
      [-20, 2], [22, -2], [-5, 18], [5, -18]
    ];
    nodePositions.forEach(pos => {
      scene.add(createGroundNode(pos[0], pos[1]));
    });

    // 6d. Trees (Lots of them, avoiding structures)
    for (let i = 0; i < 60; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 6 + Math.random() * 30;
      let x = Math.cos(angle) * radius;
      let z = Math.sin(angle) * radius;
      // Avoid the lake
      if (Math.hypot(x - 10, z - 12) < 6) continue;
      // Avoid the main station area
      if (Math.hypot(x, z) < 5) continue;
      // Avoid radar
      if (Math.hypot(x + 18, z + 8) < 3) continue;
      const scale = 0.6 + Math.random() * 0.8;
      scene.add(createTree(x, z, scale));
    }

    // 6e. Clouds (Moving)
    const clouds = [];
    function createCloud(x, y, z, scale = 1) {
      const group = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.6, roughness: 0.1 });
      const p1 = new THREE.Mesh(new THREE.SphereGeometry(0.8*scale, 6), mat);
      p1.position.set(0, 0, 0);
      group.add(p1);
      const p2 = new THREE.Mesh(new THREE.SphereGeometry(0.6*scale, 6), mat);
      p2.position.set(-1.0*scale, 0.2*scale, 0.2*scale);
      group.add(p2);
      const p3 = new THREE.Mesh(new THREE.SphereGeometry(0.7*scale, 6), mat);
      p3.position.set(1.0*scale, 0.1*scale, -0.2*scale);
      group.add(p3);
      const p4 = new THREE.Mesh(new THREE.SphereGeometry(0.5*scale, 6), mat);
      p4.position.set(0.5*scale, 0.4*scale, 0.5*scale);
      group.add(p4);
      const p5 = new THREE.Mesh(new THREE.SphereGeometry(0.5*scale, 6), mat);
      p5.position.set(-0.5*scale, 0.3*scale, -0.5*scale);
      group.add(p5);
      
      group.position.set(x, y, z);
      group.userData = { speed: 0.005 + Math.random() * 0.01, dir: Math.random() * Math.PI * 2 };
      return group;
    }

    for (let i = 0; i < 12; i++) {
      const cloud = createCloud(
        -30 + Math.random() * 60,
        12 + Math.random() * 6,
        -30 + Math.random() * 60,
        1 + Math.random() * 2
      );
      scene.add(cloud);
      clouds.push(cloud);
    }

    // 6f. IoT Data Beams (from nodes to radar)
    const beamParticles = [];
    function createDataBeam(start, end) {
      const points = [];
      const steps = 30;
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const x = start.x + (end.x - start.x) * t + (Math.random() - 0.5) * 0.5;
        const y = start.y + (end.y - start.y) * t + (Math.random() - 0.5) * 0.5 + Math.sin(t * Math.PI * 4) * 0.3;
        const z = start.z + (end.z - start.z) * t + (Math.random() - 0.5) * 0.5;
        points.push(new THREE.Vector3(x, y, z));
      }
      const geo = new THREE.BufferGeometry().setFromPoints(points);
      const mat = new THREE.LineBasicMaterial({ color: 0x00ffaa, transparent: true, opacity: 0.15 });
      const line = new THREE.Line(geo, mat);
      scene.add(line);

      // Floating particle along beam
      const particle = new THREE.Mesh(new THREE.SphereGeometry(0.06, 4), 
        new THREE.MeshBasicMaterial({ color: 0x00ffaa }));
      particle.userData = { start, end, t: Math.random(), speed: 0.002 + Math.random() * 0.002 };
      scene.add(particle);
      beamParticles.push(particle);
    }

    const radarPos = new THREE.Vector3(-18, 1.5, -8);
    const nodeEnds = [[-5, -8], [8, 5], [-12, 5], [15, -5], [-20, 2], [22, -2], [-5, 18], [5, -18]];
    nodeEnds.forEach(pos => {
      createDataBeam(new THREE.Vector3(pos[0], 0.3, pos[1]), radarPos);
    });

    // --- 7. RAIN PARTICLE SYSTEM ---
    const rainCount = 6000;
    const rainGeo = new THREE.BufferGeometry();
    const rainPos = new Float32Array(rainCount * 3);
    const rainVel = new Float32Array(rainCount);
    const rainArea = 50;
    for (let i = 0; i < rainCount; i++) {
      rainPos[i*3] = (Math.random() - 0.5) * rainArea;
      rainPos[i*3+1] = Math.random() * 20;
      rainPos[i*3+2] = (Math.random() - 0.5) * rainArea;
      rainVel[i] = 5 + Math.random() * 5;
    }
    rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
    const rainMat = new THREE.PointsMaterial({
      color: 0x88ccff,
      size: 0.08,
      transparent: true,
      opacity: 0.6,
      blending: THREE.AdditiveBlending
    });
    const rainSystem = new THREE.Points(rainGeo, rainMat);
    rainSystem.position.y = 10;
    scene.add(rainSystem);

    // --- 8. STATE & HUD ---
    const state = {
      temperature: 21,
      humidity: 65,
      pressure: 1013,
      windSpeed: 2.5,
      aqi: 42,
      rainIntensity: 10, // 0-100
      rainAccum: 0,
      aqiColor: 0x00ff00,
      aqiText: 'Good'
    };

    const tempDisplay = document.getElementById('temp-display');
    const humidityDisplay = document.getElementById('humidity-display');
    const pressureDisplay = document.getElementById('pressure-display');
    const windDisplay = document.getElementById('wind-display');
    const aqiDisplay = document.getElementById('aqi-display');
    const rainDisplay = document.getElementById('rain-display');

    function updateHUD() {
      tempDisplay.textContent = state.temperature.toFixed(1) + ' °C';
      humidityDisplay.textContent = Math.round(state.humidity) + ' %';
      pressureDisplay.textContent = Math.round(state.pressure) + ' hPa';
      windDisplay.textContent = state.windSpeed.toFixed(1) + ' m/s';
      
      // AQI
      let color = '#0f0';
      let text = 'Good';
      if (state.aqi > 100) { color = '#ff4444'; text = 'Unhealthy'; }
      else if (state.aqi > 50) { color = '#ffaa00'; text = 'Moderate'; }
      aqiDisplay.style.color = color;
      aqiDisplay.textContent = Math.round(state.aqi) + ' (' + text + ')';
      
      rainDisplay.textContent = state.rainAccum.toFixed(1) + ' mm';
    }

    // --- 9. CONTROLS & INTERACTIVITY ---
    const rainSlider = document.getElementById('rain-slider');
    const windSlider = document.getElementById('wind-slider');
    const tempSlider = document.getElementById('temp-slider');

    rainSlider.addEventListener('input', (e) => {
      state.rainIntensity = parseFloat(e.target.value);
      state.rainAccum += state.rainIntensity * 0.001;
    });

    windSlider.addEventListener('input', (e) => {
      state.windSpeed = parseFloat(e.target.value);
    });

    tempSlider.addEventListener('input', (e) => {
      state.temperature = parseFloat(e.target.value);
      // Simulate humidity change with temp
      state.humidity = 80 - (state.temperature - 10) * 0.8 + Math.random() * 5;
      state.humidity = Math.max(20, Math.min(90, state.humidity));
      // Simulate pressure change
      state.pressure = 1013 + (Math.random() - 0.5) * 10;
      // Simulate AQI change
      state.aqi = 30 + Math.random() * 70;
      updateHUD();
    });

    // Raycaster for clicks
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const clickables = [mast, rainGauge, radar, ...aqiSensors];

    renderer.domElement.addEventListener('click', (event) => {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      
      const meshes = [];
      clickables.forEach(group => {
        group.children.forEach(child => {
          if (child.isMesh) {
            child.userData.parentGroup = group;
            meshes.push(child);
          }
        });
      });

      const intersects = raycaster.intersectObjects(meshes);
      if (intersects.length > 0) {
        const hitMesh = intersects[0].object;
        const parentGroup = hitMesh.userData.parentGroup;
        if (!parentGroup) return;

        // Mast: Toggle Data Overlay (visual feedback)
        if (parentGroup.userData.isMast) {
          const box = parentGroup.children.find(c => c.geometry.type === 'BoxGeometry' && c.position.z > 0.4);
          if (box) {
            box.material.emissive.setHex(0x00ffaa);
            box.material.emissiveIntensity = box.material.emissiveIntensity > 0.5 ? 0 : 0.8;
          }
          return;
        }

        // Rain Gauge: Trigger Storm
        if (parentGroup.userData.isGauge) {
          state.rainIntensity = Math.min(100, state.rainIntensity + 30);
          rainSlider.value = state.rainIntensity;
          // Flash the funnel
          parentGroup.children.forEach(c => {
            if (c.geometry.type === 'ConeGeometry') {
              c.material.emissive = new THREE.Color(0x00aaff);
              c.material.emissiveIntensity = 0.8;
              setTimeout(() => { c.material.emissiveIntensity = 0; }, 500);
            }
          });
          return;
        }

        // AQI Sensor: Toggle status
        if (parentGroup.userData.isAQI) {
          const data = parentGroup.userData;
          state.aqi = 30 + Math.random() * 150;
          const color = state.aqi > 100 ? 0xff0000 : (state.aqi > 50 ? 0xffaa00 : 0x00ff00);
          data.ledMat.color.setHex(color);
          data.ledMat.emissive.setHex(color);
          updateHUD();
          return;
        }
      }
    });

    // --- 10. ANIMATION LOOP ---
    let time = 0;

    function animate() {
      requestAnimationFrame(animate);
      time += 0.01;

      // 1. Anemometer (Spins based on wind)
      if (mast.userData.anemGroup) {
        mast.userData.anemGroup.rotation.y += state.windSpeed * 0.03;
      }
      // Wind Vane (Points into wind)
      if (mast.userData.vaneGroup) {
        mast.userData.vaneGroup.rotation.y = Math.sin(time * 0.5) * 0.5 + state.windSpeed * 0.1;
      }

      // 2. Radar Dish Rotation
      if (radar.userData.dishGroup) {
        radar.userData.dishGroup.rotation.y += 0.01;
        // Dish tilt oscillation
        radar.userData.dishGroup.rotation.x = Math.PI / 2.5 + Math.sin(time * 0.3) * 0.1;
      }

      // 3. Rain System
      const positions = rainSystem.geometry.attributes.position.array;
      const rainIntensityFactor = state.rainIntensity / 100;
      const dropSpeed = 8 + state.windSpeed * 0.5;
      for (let i = 0; i < rainCount; i++) {
        positions[i*3+1] -= dropSpeed * 0.02 * (0.5 + rainIntensityFactor * 0.5);
        // Wind drift
        positions[i*3] += state.windSpeed * 0.005 * (Math.random() - 0.5);
        if (positions[i*3+1] < 0) {
          positions[i*3] = (Math.random() - 0.5) * rainArea;
          positions[i*3+1] = 18 + Math.random() * 4;
          positions[i*3+2] = (Math.random() - 0.5) * rainArea;
        }
      }
      rainSystem.geometry.attributes.position.needsUpdate = true;
      
      // Rain opacity based on intensity
      rainSystem.material.opacity = 0.1 + rainIntensityFactor * 0.6;

      // 4. Rain Gauge Water Level
      const gaugeData = rainGauge.userData;
      if (gaugeData.water) {
        const targetH = 0.1 + state.rainIntensity * 0.002;
        gaugeData.water.scale.y = 0.1 + (targetH - 0.1) * 0.05; // Smooth rise
        gaugeData.water.position.y = 0.3 + gaugeData.water.scale.y * 0.5;
      }

      // 5. Cloud Movement
      clouds.forEach(cloud => {
        const dir = cloud.userData.dir;
        const spd = cloud.userData.speed * (1 + state.windSpeed * 0.05);
        cloud.position.x += Math.cos(dir) * spd;
        cloud.position.z += Math.sin(dir) * spd;
        if (cloud.position.x > 40) cloud.position.x = -40;
        if (cloud.position.x < -40) cloud.position.x = 40;
        if (cloud.position.z > 40) cloud.position.z = -40;
        if (cloud.position.z < -40) cloud.position.z = 40;
      });

      // 6. Data Beam Particles
      beamParticles.forEach(p => {
        const d = p.userData;
        d.t += d.speed * (0.5 + state.windSpeed * 0.02);
        if (d.t > 1) d.t = 0;
        const t = d.t;
        const start = d.start;
        const end = d.end;
        const x = start.x + (end.x - start.x) * t + Math.sin(t * Math.PI * 6) * 0.3;
        const y = start.y + (end.y - start.y) * t + Math.sin(t * Math.PI * 6 + 1) * 0.3 + 0.3;
        const z = start.z + (end.z - start.z) * t + Math.cos(t * Math.PI * 6) * 0.3;
        p.position.set(x, y, z);
      });

      // 7. AQI Sensor LEDs Blink
      aqiSensors.forEach((sensor, idx) => {
        if (sensor.userData.led) {
          const blink = Math.sin(time * 3 + idx) > 0.5 ? 0.5 : 1.0;
          sensor.userData.ledMat.emissiveIntensity = blink * 0.8;
        }
      });

      // 8. Update HUD periodically
      if (Math.floor(time * 4) % 2 === 0) {
        // Simulate slight natural drift
        state.pressure += (Math.random() - 0.5) * 0.2;
        state.aqi += (Math.random() - 0.5) * 0.5;
        state.aqi = Math.max(10, Math.min(180, state.aqi));
        state.rainAccum += state.rainIntensity * 0.00005;
        updateHUD();
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // --- 11. RESIZE ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Initial HUD update
    updateHUD();
  </script>
</body>
</html>
